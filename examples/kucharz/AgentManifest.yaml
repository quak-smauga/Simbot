apiVersion: qwe/v1
kind: Agent
name: kucharz
version: 0.1.0
description: przepisy z tego, co masz, i plan posiłków
runtime:
  base: qwe/agent-runtime:0.1.0
capabilities:
  builtin:
    - web
    - computer
    - skills
  plugins: ./plugins
  packages: []
  skills: ./skills
dependencies:
  npm: []
  system: []
model:
  provider: anthropic
persona: ./persona.md
look:
  color: "#3BB273"
  avatar:
    shape: leaf
    eyes: dot
    mouth: smile
    pattern: none
    idle: sway
    acc:
      - sprout
memory:
  enabled: true
  max: 200
