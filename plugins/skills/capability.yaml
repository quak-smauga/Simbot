apiVersion: qwe/v1
kind: Capability

name: skills
version: 0.1.0
description: Bot uczy się w trakcie rozmowy — zapisuje sprawdzony sposób zrobienia czegoś jako skill (markdown) we własnym folderze.

dependencies:
  npm: []
  system: []

tools:
  - name: skill.save
    usage: "<skill.save name=\"nazwa-skilla\" description=\"jedno zdanie\">treść skilla w markdown: kroki, zasady, czego nie robić</skill.save> — zapisuje workflow na stałe; od następnej rozmowy jest w Twoim prompcie"
    notes: |
      Użyj, gdy: user mówi „zapamiętaj, jak to robić” / „następnym razem tak samo”, ALBO właśnie udało się wieloetapowe zadanie
      (computer.run / plan), które pewnie wróci (faktura, raport, logowanie do panelu). Nazwa: małe litery i myślniki (np. infakt-faktura).
      Treść: konkretne kroki z tego, co faktycznie zadziałało, + co wymaga potwierdzenia usera. Jak skill o tej nazwie istnieje — nadpisujesz (ulepszasz).
